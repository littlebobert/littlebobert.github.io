<body class="sasu-site">
  <main class="sasu-page">
    <div class="language-switcher"><button class="language-switch" type="button" aria-label="日本語に切り替える">日本語</button></div>
    <section class="sasu-hero">
      <div class="sasu-hero-header">
        <a href="karui.html"><img class="sasu-icon karui-icon" src="assets/karui-icon.png?v=2" alt="Karui app icon" data-alt-en="Karui app icon" data-alt-ja="Karuiアプリアイコン"></a>
        <div><h1 data-label-en="Acknowledgements" data-label-ja="謝辞">Acknowledgements</h1><div class="sasu-subtitle">Karui</div></div>
      </div>
    </section>
    <section class="karui-section">
      <p data-label-en="Thank you to:" data-label-ja="感謝を込めて：">Thank you to:</p>
      <ul>
        <li data-label-en="My mom, for her initial feedback early in Karui’s development." data-label-ja="Karuiの開発初期にフィードバックをくれた母。">My mom, for her initial feedback early in Karui’s development.</li>
        <li data-label-en="Dennis van Mazijk, for testing Karui and reporting bugs in the setup wizard and the Test It tab." data-label-ja="Karuiをテストし、セットアップウィザードと「テスト」タブのバグを報告してくれたDennis van Mazijkさん。">Dennis van Mazijk, for testing Karui and reporting bugs in the setup wizard and the Test It tab.</li>
      </ul>
    </section>
    <footer class="karui-footer"><p class="footer-links"><a href="karui.html" data-label-en="Home" data-label-ja="ホーム">Home</a><span class="footer-separator" aria-hidden="true">|</span><a href="karui-privacy.html" data-label-en="Privacy" data-label-ja="プライバシー">Privacy</a><span class="footer-separator" aria-hidden="true">|</span><a href="karui-support.html" data-label-en="Support" data-label-ja="サポート">Support</a></p><p><span data-label-en="Made by" data-label-ja="制作者：">Made by</span> <a href="https://onemorething.tokyo">Justin Garcia</a><span data-label-en=" in Japan." data-label-ja="（日本）"> in Japan.</span></p></footer>
  </main>
  <script>
    const supportedLanguages = ['en', 'ja'];
    const languageSwitch = document.querySelector('.language-switch');
    let currentLanguage = 'en';

    function preferredLanguage() {
      const language = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase();
      return language.startsWith('ja') ? 'ja' : 'en';
    }

    function setLanguage(language, persist = true) {
      const selected = supportedLanguages.includes(language) ? language : 'en';
      document.querySelectorAll('[data-label-en][data-label-ja]').forEach((element) => {
        const label = selected === 'ja' ? element.dataset.labelJa : element.dataset.labelEn;
        if (element instanceof HTMLMetaElement) element.content = label;
        else element.textContent = label;
      });
      document.querySelectorAll('[data-alt-en][data-alt-ja]').forEach((element) => {
        element.alt = selected === 'ja' ? element.dataset.altJa : element.dataset.altEn;
      });
      document.documentElement.lang = selected;
      currentLanguage = selected;
      languageSwitch.textContent = selected === 'ja' ? 'English' : '日本語';
      languageSwitch.setAttribute('aria-label', selected === 'ja' ? 'Switch to English' : '日本語に切り替える');
      if (persist) localStorage.setItem('karui-language', selected);
    }

    languageSwitch.addEventListener('click', () => setLanguage(currentLanguage === 'ja' ? 'en' : 'ja'));
    setLanguage(localStorage.getItem('karui-language') || preferredLanguage(), false);
  </script>
</body>
