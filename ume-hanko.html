<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Umete: 空欄を埋めて</title>
  <link href="sasu-common.css?v=5" rel="stylesheet">
  <link rel="icon" href="assets/umete-glass-favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="assets/umete-glass-icon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://umete.jp/hanko">
  <meta name="description" content="The 空欄を埋めて seal on Umete’s home page: “fill in the blanks,” in the style of a Japanese hanko." data-label-en="The 空欄を埋めて seal on Umete’s home page: “fill in the blanks,” in the style of a Japanese hanko." data-label-ja="Umeteのホームページにある「空欄を埋めて」の判子。">
  <meta property="og:title" content="Umete: 空欄を埋めて" data-label-en="Umete: 空欄を埋めて" data-label-ja="Umete：空欄を埋めて">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://umete.jp/hanko">
  <meta property="og:site_name" content="Umete">
  <meta property="og:description" content="The 空欄を埋めて seal on Umete’s home page: “fill in the blanks,” in the style of a Japanese hanko." data-label-en="The 空欄を埋めて seal on Umete’s home page: “fill in the blanks,” in the style of a Japanese hanko." data-label-ja="Umeteのホームページにある「空欄を埋めて」の判子。">
  <meta property="og:image" content="https://umete.jp/assets/umete-social.png?v=7">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body.sasu-site { background: #fff; }
    /* The seal on its own page, as on Karui's and Kaketa's sites. A separate page rather
       than an overlay on the home page, so nothing of the home page can show through
       while the seal inks in. */
    .sasu-page { min-height: 100svh; box-sizing: border-box; display: flex; flex-direction: column; }
    .ume-hanko { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8pt; padding-bottom: 8vh; text-align: center; }
    /* A white ring around the image: the ink-in needs paper on every side of the border
       to thin it evenly. */
    .ume-hanko img { width: 118px; height: auto; margin-bottom: 4pt; background: #fff; box-shadow: 0 0 0 6px #fff; }
    .ume-hanko-title { font-size: 14pt; font-weight: bold; }
    .ume-hanko-note { max-width: 28em; margin: 0; line-height: 1.65em; color: black; text-wrap: pretty; }
  </style>
</head>
<body class="sasu-site">
  <main class="sasu-page">
    <div class="language-switcher">
      <button class="language-switch" type="button" aria-label="日本語に切り替える">日本語</button>
    </div>
    <section class="ume-hanko">
      <img src="assets/umete-seal-tagline-large.png?v=1" alt="Seal reading 空欄を埋めて (Fill in the blanks)" data-alt-en="Seal reading 空欄を埋めて (Fill in the blanks)" data-alt-ja="「空欄を埋めて」と入った判子" width="118" height="283">
      <script src="karui-seal-ink.js?v=1"></script>
      <script>karuiInkIn(document.currentScript.previousElementSibling.previousElementSibling, 100);</script>
      <div class="ume-hanko-title" data-label-en="Fill in the blanks" data-label-ja="空欄を埋めて">Fill in the blanks</div>
      <p class="ume-hanko-note" data-label-en="Umete is Japanese for “fill it in.” This seal reads 空⁠欄⁠を⁠埋⁠め⁠て, or “fill in the blanks.” It’s meant to resemble a hanko, the seal people in Japan use to sign important documents." data-label-ja="Umeteという名前は「埋めて」から来ています。この判子には「空欄を埋めて」と入っています。">Umete is Japanese for “fill it in.” This seal reads 空⁠欄⁠を⁠埋⁠め⁠て, or “fill in the blanks.” It’s meant to resemble a hanko, the seal people in Japan use to sign important documents.</p>
      <a class="ume-hanko-close" href="ume.html" data-label-en="Close" data-label-ja="閉じる">Close</a>
    </section>
  </main>
  <script>
    // Coming from the home page, Close goes back to it, where it was left, rather than
    // loading it again.
    document.querySelector('.ume-hanko-close').addEventListener('click', (event) => {
      let fromHome = false;
      try { fromHome = new URL(document.referrer).origin === location.origin; } catch {}
      if (!fromHome || history.length < 2) return;
      event.preventDefault();
      history.back();
    });
  </script>
  <script src="umete-language.js?v=2"></script>
</body>
</html>
