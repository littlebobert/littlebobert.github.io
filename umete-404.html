<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found · Umete</title>
  <link href="sasu-common.css?v=5" rel="stylesheet">
  <link rel="icon" href="assets/umete-glass-favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="assets/umete-glass-icon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    /* umete.jp's 404 page, as karui.jp's. Cloudflare Pages serves it, with a 404 status,
       for any address that isn't a page, instead of the home page with a 200. */
    body.sasu-site { background: #fff; }
    .umete-not-found { min-height: 70svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10pt; text-align: center; }
    .umete-not-found img { width: 64px; height: 64px; border-radius: 14px; }
    .umete-not-found h1 { margin: 4pt 0 0; font-size: 18pt; }
    .umete-not-found p { margin: 0; color: #555; }
  </style>
</head>
<body class="sasu-site">
  <main class="sasu-page umete-not-found">
    <img src="assets/umete-glass-icon.png?v=2" alt="Umete app icon" width="64" height="64">
    <h1>Page not found</h1>
    <p lang="ja">ページが見つかりません</p>
    <p><a href="ume.html">Go to umete.jp</a></p>
  </main>
</body>
</html>
